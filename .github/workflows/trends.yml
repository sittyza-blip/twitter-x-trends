name: แจ้งเตือนเทรนด์ X เข้า Telegram

on:
  schedule:
    - cron: "0 * * * *"   # ทุกชั่วโมง ตรงนาทีที่ 0 (เวลา UTC)
  workflow_dispatch: {}    # กดรันเองได้จากหน้า Actions

concurrency:
  group: trends
  cancel-in-progress: false

permissions:
  contents: write          # ให้ commit state.json กลับเข้า repo เพื่อจำอันดับรอบก่อน

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ดึงเทรนด์แล้วส่ง Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          REGIONS: ${{ vars.REGIONS || 'thailand, worldwide' }}
          TOP_N: ${{ vars.TOP_N || '10' }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          ONLY_ON_CHANGE: ${{ vars.ONLY_ON_CHANGE || 'true' }}
        run: python main.py

      - name: จำอันดับรอบนี้ไว้ (commit state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
