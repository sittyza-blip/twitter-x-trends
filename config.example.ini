; คัดลอกไฟล์นี้เป็น config.ini แล้วใส่ค่าให้ครบ
; วิธีเอา token: ทักหา @BotFather ใน Telegram -> /newbot -> ก็อป token มาวางที่ bot_token
; วิธีเอา chat_id: ทักหาบอทที่เพิ่งสร้าง (พิมพ์อะไรก็ได้) แล้วรัน  python get_chat_id.py

[telegram]
bot_token = 123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
chat_id = 123456789

[settings]
; พื้นที่ที่จะดึงเทรนด์ คั่นด้วย comma (ใช้ slug ของ trends24.in)
; ไทย = thailand, ทั่วโลก = worldwide
regions = thailand, worldwide
; จำนวนเทรนด์สูงสุดต่อพื้นที่ที่จะส่ง
top_n = 10

; ส่งเฉพาะตอนเทรนด์เปลี่ยนจากรอบก่อน (true = ไม่ส่งซ้ำถ้าเหมือนเดิม)
only_on_change = true

; คำที่อยากให้เตือนเป็นพิเศษ พอมันติดเทรนด์จะมี 📢 + ขึ้นหัวข้อเด่น (คั่นด้วย comma, เว้นว่าง = ปิด)
; เทียบแบบไม่สนตัวพิมพ์เล็กใหญ่ และเจอเป็นบางส่วนก็นับ เช่น "redkiss" จะแมตช์ "#RiserStopIgnoringRedKiss"
keywords =

; ช่วงเวลาที่ไม่ส่ง (เวลาไทย) รูปแบบ start-end เช่น 0-7 = งด 00:00–06:59 ; ข้ามเที่ยงคืนได้ เช่น 23-7 ; เว้นว่าง = ส่งทั้งวัน
quiet_hours =
